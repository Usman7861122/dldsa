name: Deploy to AWS S3

# Every push to the main branch builds the site and uploads it to S3.
on:
  push:
    branches: [main]
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Build the site
        run: npm run build

      - name: Connect to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Files in /_astro have a new name every time they change, so they can be cached for a year.
      - name: Upload assets (long cache)
        run: |
          aws s3 sync dist/_astro s3://${{ secrets.S3_BUCKET }}/_astro \
            --cache-control "public,max-age=31536000,immutable" --delete

      # Everything else: browsers should check for a fresh copy.
      - name: Upload pages and images
        run: |
          aws s3 sync dist s3://${{ secrets.S3_BUCKET }} \
            --exclude "_astro/*" \
            --cache-control "public,max-age=0,must-revalidate" --delete

      # Only runs if you later add a CloudFront distribution ID as a repository variable.
      - name: Clear CloudFront cache
        if: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
